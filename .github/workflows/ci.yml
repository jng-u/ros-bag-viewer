name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm check:m0
      - run: pnpm check:m1
      - run: pnpm check:m2
      - run: pnpm check:m3
      - run: pnpm check:m4
      - run: pnpm evidence:m3
      - run: pnpm evidence:semantic
      - run: pnpm test:security
      - run: pnpm test:a11y
      - run: pnpm test:ux
      - run: pnpm build
      - run: pnpm bench:micro
      - run: pnpm bench:corpus
      - run: pnpm audit:dependencies
      - run: pnpm report:licenses
      - run: pnpm sbom
      - run: test -z "$(git status --porcelain)"
