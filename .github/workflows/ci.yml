name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with: { version: 9.15.5 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22.23.3, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm check:m0
      - run: pnpm check:m1
      - run: pnpm check:m2
      - run: pnpm check:m3
      - run: pnpm check:m4
      - run: pnpm check:m5
      - run: pnpm test:toolchain
      - run: pnpm evidence:m3
      - run: pnpm evidence:semantic
      - run: pnpm test:security
      - run: pnpm test:a11y
      - run: pnpm test:ux
      - run: pnpm build
      - run: pnpm bench:micro
      - run: pnpm bench:corpus
      - run: pnpm exec vitest run --config benchmarks/scenarios/vitest.config.ts
      - run: pnpm audit:dependencies
      - run: pnpm report:licenses
      - run: pnpm sbom
      - run: pnpm release:readiness:full
