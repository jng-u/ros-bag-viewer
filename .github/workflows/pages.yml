name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Generate small KITTI demo
        # Keep dataset binaries out of Git and verify the recording before publishing.
        timeout-minutes: 5
        run: |
          pnpm demo:kitti
          pnpm exec vitest run apps/web/test/kitti-demo.test.ts

      - name: Check integration and security boundaries
        run: |
          pnpm test:integration
          pnpm test:security

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build static viewer
        run: pnpm build:web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_STATIC_HOST: "true"

      - name: Verify Pages in Firefox with software WebGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          FIREFOX_HEADLESS: "0"
          FIREFOX_SOFTWARE_WEBGL: "1"
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version
          command -v xvfb-run
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24 +extension GLX" pnpm test:e2e:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist-web

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
