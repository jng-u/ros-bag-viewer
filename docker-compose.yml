services:
  share:
    build:
      context: .
      dockerfile: deploy/share.Dockerfile
    image: ros-web-viewer-share:local
    restart: unless-stopped
    environment:
      SHARE_ALLOW_ANONYMOUS_CREATE: "${SHARE_ALLOW_ANONYMOUS_CREATE:-false}"
      SHARE_CREATE_TOKEN: "${SHARE_CREATE_TOKEN:-}"
    read_only: true
    volumes:
      - share-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros-web-viewer:local
    ports:
      - "${ROS_WEB_VIEWER_BIND:-127.0.0.1}:${ROS_WEB_VIEWER_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      share:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /config:size=1m,mode=0755,uid=10001,gid=10001
      - /data:size=4m,mode=0755,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ros1-bridge:
    profiles: ["ros1"]
    build:
      context: .
      dockerfile: deploy/ros1-bridge.Dockerfile
    image: ros-web-viewer-ros1-bridge:local
    network_mode: host
    environment:
      ROS_MASTER_URI: "${ROS_MASTER_URI:-http://127.0.0.1:11311}"
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      BIND_HOST: 127.0.0.1
      SESSION_TOKEN: "${ROS_LIVE_SESSION_TOKEN:-change-me-local}"
      SESSION_TTL_SECONDS: "${ROS_LIVE_SESSION_TTL_SECONDS:-3600}"
      ALLOWED_BROWSER_ORIGINS: "${ROS_LIVE_BROWSER_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
    volumes:
      - ./deploy/live-topics.ros1.json:/config/topics.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ros2-bridge:
    profiles: ["ros2"]
    build:
      context: .
      dockerfile: deploy/ros2-bridge.Dockerfile
    image: ros-web-viewer-ros2-bridge:local
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      ROS_HOME: /tmp/ros
      ROS_LOG_DIR: /tmp/ros/log
      BIND_HOST: 127.0.0.1
      SESSION_TOKEN: "${ROS_LIVE_SESSION_TOKEN:-change-me-local}"
      SESSION_TTL_SECONDS: "${ROS_LIVE_SESSION_TTL_SECONDS:-3600}"
      ALLOWED_BROWSER_ORIGINS: "${ROS_LIVE_BROWSER_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
    volumes:
      - ./deploy/live-topics.ros2.json:/config/topics.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  share-data:
