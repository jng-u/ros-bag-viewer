services:
  viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros-web-viewer:local
    ports:
      - "${ROS_WEB_VIEWER_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:size=1m,mode=0755
      - /data:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
